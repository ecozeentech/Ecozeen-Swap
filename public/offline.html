<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Ecozeen Swap</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0b0e; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 24px; }
        .card { max-width: 380px; }
        .badge { width: 64px; height: 64px; border-radius: 16px; background: #2D6A4F; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; margin: 0 auto 20px; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p { color: #a1a8b3; font-size: 14px; line-height: 1.5; }
        button { margin-top: 20px; background: #2D6A4F; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">E</div>
        <h1>You're offline</h1>
        <p>Ecozeen Swap needs an internet connection to show live rates, balances, and to process trades safely. Please reconnect and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
